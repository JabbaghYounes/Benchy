# LLM Benchmark Configuration
# Edge AI Benchmark Suite

# Benchmark methodology settings
benchmark:
  warmup_runs: 3
  measured_runs: 10
  # Per-request HTTP read timeout (seconds) for /api/generate calls in
  # the warmup + measured loop. 600s is comfortable for llama2:7b on a
  # Pi 5 once the model is resident; the cold-load is absorbed by the
  # prewarm step (next field). Raise this only if a single request
  # legitimately runs longer (e.g. larger max_tokens against a slow
  # NPU).
  http_timeout_seconds: 600
  # Long timeout (seconds) for the one-shot prewarm call the runner
  # issues before the measured loop. Sized for the worst-case Ollama
  # cold-load: 7B weights from SD storage on a Pi 5 with no thermal
  # headroom can take 600+ seconds. See Issue 12 in
  # resources/session_issues_2026-04-27.md.
  prewarm_timeout_seconds: 1800

# Ollama API settings
ollama:
  api_base: "http://localhost:11434"

# Default profile - llama2:7b across three quant levels.
# `quant_tag_template` controls how `models` × `quants` is composed into
# Ollama tags. For llama2 (which ships chat variants under -chat-*) the
# template is `{base}-chat-{quant}`; for llama3.x use `{base}-instruct-{quant}`
# or just `{base}-{quant}` depending on the tag namespace in Ollama.
default:
  model_groups: ["7B"]
  models: ["llama2:7b"]
  quants: ["q4_K_M", "q5_K_M", "q8_0"]
  quant_tag_template: "{base}-chat-{quant}"

# Full profile - sweeps the three canonical CPU groups (1B, 3B, 7B).
# 1B/3B exercise the lightweight prompt set and finish quickly; 7B is the
# realistic-workload tier. Higher-parameter groups (8B, 9B) are no longer
# part of the benchmark surface — see Issue 6 in
# resources/session_issues_2026-04-27.md for rationale.
full:
  model_groups: ["1B", "3B", "7B"]

# Drone profile - 7B model with drone-use-case prompts (scene description,
# target identification, mission preflight, telemetry interpretation, hazard
# reasoning). The prompt_set switch is honoured by the runner; the top-level
# `prompts:` block is ignored when prompt_set is set on the profile.
drone:
  model_groups: ["7B"]
  models: ["llama2:7b"]
  prompt_set: drone

# NPU profile - LLM-on-Hailo-10H via HailoRT GenAI's Ollama-compatible REST
# server (default port 8000 per the hailo-ollama README; adjust api_base
# if your install binds elsewhere). Uses llama3.2:3b — per docs/hailo.md
# this is the llama-family model with a published Hailo HEF. backend:
# "hailo-10h" tags every result so the dashboard can split CPU-side runs
# from NPU-side runs on the same prompts. npu_metrics: true attaches
# HailoLLMMetricsCollector alongside the host ResourceMonitor. The runner
# aborts with a clear message if this profile is run on anything other
# than Platform.RPI_AI_HAT_PLUS_2.
npu:
  api_base: "http://localhost:8000"
  backend: "hailo-10h"
  npu_metrics: true
  model_groups: ["3B"]
  models: ["llama3.2:3b"]
  prompt_set: drone

# Model definitions by size group. Llama-family only — three groups, one
# model per group. See Issue 7 in resources/session_issues_2026-04-27.md
# for the consolidation rationale (provenance/licensing/architecture
# parity across groups). The `npu` profile reuses the 3B group (llama3.2:3b
# has a published Hailo HEF per docs/hailo.md).
models:
  1B:
    - llama3.2:1b
  3B:
    - llama3.2:3b
  7B:
    - llama2:7b

# Deterministic generation settings
generation:
  temperature: 0.0
  top_p: 1.0
  top_k: 1
  seed: 42
  max_tokens: 256

# Fixed, version-controlled prompt set
prompts:
  - id: simple_qa
    prompt: "What is the capital of France? Answer in one word."
    description: "Simple factual question"
    expected_tokens: 10

  - id: reasoning
    prompt: "If a train travels at 60 mph for 2 hours, how far does it travel? Show your calculation step by step."
    description: "Mathematical reasoning"
    expected_tokens: 100

  - id: code_generation
    prompt: "Write a Python function that checks if a number is prime. Include a docstring."
    description: "Code generation task"
    expected_tokens: 150

  - id: summarization
    prompt: "Summarize the concept of machine learning in exactly three sentences."
    description: "Summarization task"
    expected_tokens: 80

  - id: creative
    prompt: "Write a haiku about artificial intelligence."
    description: "Creative writing"
    expected_tokens: 30

# Metrics to capture
metrics:
  - time_to_first_token_ms
  - tokens_per_second
  - total_latency_ms
  - output_tokens
  - cpu_percent
  - memory_used_mb
  - power_watts
