# LLM Benchmark Configuration
# Edge AI Benchmark Suite

# Benchmark methodology settings
benchmark:
  warmup_runs: 3
  measured_runs: 10
  # Per-request HTTP read timeout (seconds) for /api/generate calls in
  # the warmup + measured loop. 600s is comfortable for llama2:7b on a
  # Pi 5 once the model is resident; the cold-load is absorbed by the
  # prewarm step (next field). Raise this only if a single request
  # legitimately runs longer (e.g. larger max_tokens against a slow
  # NPU).
  http_timeout_seconds: 600
  # Long timeout (seconds) for the one-shot prewarm call the runner
  # issues before the measured loop. Sized for the worst-case Ollama
  # cold-load: 7B weights from SD storage on a Pi 5 with no thermal
  # headroom can take 600+ seconds. See Issue 12 in
  # resources/session_issues_2026-04-27.md.
  prewarm_timeout_seconds: 1800

# Ollama API settings
ollama:
  api_base: "http://localhost:11434"

# Default profile — bare llama2:7b for a quick CPU smoke test.
# Quant sweeps are intentionally NOT enabled here: the project policy is
# llama-only across 1B / 3B / 7B, and chat-quant variants are too heavy
# on disk for an SD-card-backed Pi. To re-enable a quant sweep, add
# `quants:` and `quant_tag_template:` back (see git history).
default:
  model_groups: ["7B"]
  models: ["llama2:7b"]

# Full profile - sweeps the three canonical CPU groups (1B, 3B, 7B).
# 1B/3B exercise the lightweight prompt set and finish quickly; 7B is the
# realistic-workload tier. Higher-parameter groups (8B, 9B) are no longer
# part of the benchmark surface — see Issue 6 in
# resources/session_issues_2026-04-27.md for rationale.
full:
  model_groups: ["1B", "3B", "7B"]

# Drone profile - 7B model with drone-use-case prompts (scene description,
# target identification, mission preflight, telemetry interpretation, hazard
# reasoning). The prompt_set switch is honoured by the runner; the top-level
# `prompts:` block is ignored when prompt_set is set on the profile.
drone:
  model_groups: ["7B"]
  models: ["llama2:7b"]
  prompt_set: drone

# NPU profile — LLM-on-Hailo-10H via HailoRT GenAI's Ollama-compatible
# REST server (default port 8000 per the hailo-ollama README; adjust
# api_base if your install binds elsewhere). Uses llama3.2:1b — the only
# llama-family model with a prebuilt HEF in the HailoRT 5.3.0 GenAI Model
# Zoo (5.1.1 had llama3.2:3b but Hailo dropped it in 5.3.0; no 7B HEFs
# have ever shipped). Matches the project's llama-only policy.
# backend: "hailo-10h" tags every result so the dashboard can split
# CPU-side runs from NPU-side runs on the same prompts. npu_metrics: true
# attaches HailoLLMMetricsCollector alongside the host ResourceMonitor.
# The runner aborts with a clear message if this profile is run on
# anything other than Platform.RPI_AI_HAT_PLUS_2.
# Pull the matching HEF onto the GenAI server before the first run:
#   curl -sS http://localhost:8000/api/pull \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"llama3.2:1b","stream":true}'
npu:
  api_base: "http://localhost:8000"
  backend: "hailo-10h"
  npu_metrics: true
  model_groups: ["1B"]
  models: ["llama3.2:1b"]
  prompt_set: drone

# Compare profile — CPU-side mirror of the npu profile. Runs the SAME
# model (llama3.2:1b) and SAME drone prompts on Ollama CPU so the
# dashboard can split a real apples-to-apples NPU-vs-CPU comparison
# row from a single verify-sweep bundle. Used by
# scripts/verify_ai_hat_plus_2.sh as the "CPU comparison row".
#
# Why this exists separately from `drone`: the standalone `drone` profile
# uses llama2:7b for users with 8 GB Pi 5s, but llama2:7b needs ~5.5 GB
# RAM at runtime and won't fit on a 4 GB Pi 5. The `compare` profile is
# the RAM-safe, fits-on-any-Pi-5 alternative whose primary purpose is
# cross-backend dashboard comparison, not realistic drone load.
compare:
  model_groups: ["1B"]
  models: ["llama3.2:1b"]
  prompt_set: drone

# Model definitions by size group. Llama-only policy: one model per size
# group, all from the llama family. Other families (qwen, mistral, gemma,
# dolphin, olmo) and other sizes (1.5B, 8B, 9B) were dropped on
# 2026-04-27 to fit an SD-card-backed Pi 5; see
# resources/session_notes_2026-04-27.md and Issue 7 in
# resources/session_issues_2026-04-27.md for the rationale (provenance /
# licensing / architecture parity across groups).
models:
  1B:
    - llama3.2:1b   # also the npu-profile model (only llama HEF in HailoRT 5.3.0 GenAI Model Zoo)
  3B:
    - llama3.2:3b
  7B:
    - llama2:7b

# Deterministic generation settings
generation:
  temperature: 0.0
  top_p: 1.0
  top_k: 1
  seed: 42
  max_tokens: 256

# Fixed, version-controlled prompt set
prompts:
  - id: simple_qa
    prompt: "What is the capital of France? Answer in one word."
    description: "Simple factual question"
    expected_tokens: 10

  - id: reasoning
    prompt: "If a train travels at 60 mph for 2 hours, how far does it travel? Show your calculation step by step."
    description: "Mathematical reasoning"
    expected_tokens: 100

  - id: code_generation
    prompt: "Write a Python function that checks if a number is prime. Include a docstring."
    description: "Code generation task"
    expected_tokens: 150

  - id: summarization
    prompt: "Summarize the concept of machine learning in exactly three sentences."
    description: "Summarization task"
    expected_tokens: 80

  - id: creative
    prompt: "Write a haiku about artificial intelligence."
    description: "Creative writing"
    expected_tokens: 30

# Metrics to capture
metrics:
  - time_to_first_token_ms
  - tokens_per_second
  - total_latency_ms
  - output_tokens
  - cpu_percent
  - memory_used_mb
  - power_watts
